set-option -g prefix C-Space

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g mouse on
set -g history-limit 100000

set-option -g default-shell /bin/zsh

# Keymaps
bind -r r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind -r F run-shell "tmux neww ~/.config/tmux/custom_scripts/sessionizer"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar (george hotz)
set -g status-style "fg=white,bg=color234"
set -g status-left ' '
set -g status-right "#[bg=#9c9c9c,fg=black,bold] #S #[bg=#b8b8b8,fg=black,bold] %d/%m #[bg=#d4d4d4] %H:%M "

set -g window-status-format "#[fg=colour143]#I#[fg=colour243]:#[fg=grey]#W#{?window_active,,#[fg=colour243]-} "
set -g window-status-current-format "#[fg=colour143]#I#[fg=colour231]:#W#[fg=cyan]* "

